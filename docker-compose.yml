version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAIN_URL: ${NEXT_PUBLIC_MAIN_URL:-https://уборкаснегакрасноярск.рф}
    image: ${COOLIFY_CONTAINER_NAME:-snow-cleaning}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - '3000:3000'
    labels:
      coolify.managed: 'true'
